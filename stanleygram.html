<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanlygram • Feed</title>
    
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="barra-arriba">
        <h1 class="titulo-principal" style="font-size: 28px; margin-bottom: 0;">Stanlygram</h1>
    </header>

    <main class="contenedor-posts">

        <div class="tarjeta-post">
            <div class="cabecera-post">
                <div class="nombre-autor">confi_v7</div>
            </div>
            
            <div class="zona-imagen">
                <img src="imagenes/carros.jpg" alt="Camionetas" class="foto-publicada">
            </div>
            

                <div class="contador-likes">2,450 Me gusta</div>
                <div class="texto-descripcion">
                    <span class="nombre-autor">confi_v7</span> Los carros engazados #Toyota #Lexus #Jutiapa
                </div>
            </div>
        </div>

        <div class="tarjeta-post">
            <div class="cabecera-post">
                <div class="nombre-autor">brandon.atunxd</div>
            </div>
            
            <div class="zona-imagen">
                <img src="imagenes/50b91170.jpg" alt="Lago" class="foto-publicada">
            </div>
            
          
                <div class="contador-likes">3,120 Me gusta</div>
                <div class="texto-descripcion">
                    <span class="nombre-autor">brandon.atunxd </span> El lago pero no de amatitlan va primo #Lago #ElSalvador #Views
                </div>
            </div>
        </div>

    </main>

</body>
</html>
