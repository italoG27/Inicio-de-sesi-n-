<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanlygram</title>
    
    <link rel="stylesheet" href="estilos.css">
    <script src="codigo.js"></script>
</head>
<body>

    <div class="caja-padre">
        
        <div class="caja-hijo1">
            <h1 class="titulo-principal">Stanlygram</h1>
            <p class="texto-suave">Regístrate para ver fotos y videos de tus carnales</p>
            
           <input type="text" id="campoUserReg" placeholder="Nombre de usuario">
            <input type="password" id="campoPassReg" placeholder="Contraseña">
            <button onclick="guardarUsuario()">Registrarte primo</button>
        </div>

        <div class="caja-hijo2">
            <h2 class="subtitulo-login">Iniciar Sesión</h2>
            <input type="text" id="campoUserLog" placeholder="Usuario">
            <input type="password" id="campoPassLog" placeholder="Contraseña">
            <button onclick="validarIngreso()">Iniciar sesión a mi cuenta chilera</button>
            
            <hr class="linea-divisora">
            <p class="texto-suave">¿Olvidaste tu contraseña primo?</p>
        </div>

    </div>

</body>
</html>
